name: Website

# Deploys site/ to GitHub Pages (custom domain: gitchrono.com).
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-changelog.py", "scripts/changelog.template.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Changelog from GitHub releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-changelog.py --test && python3 scripts/build-changelog.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
