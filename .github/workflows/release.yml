name: Release

# Push a tag like `v0.2.0` (see scripts/release.sh) to build every platform and
# publish a GitHub Release. Tags with a suffix (`v0.2.0-beta.1`) become pre-releases.
# Pushing a `release/**` branch or running it manually builds the artifacts
# without publishing — a dry run of the whole pipeline.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # start the website deploy so /changelog shows the new release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-14
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stamp it into the workspace so `CARGO_PKG_VERSION` matches the tag.
          perl -0pi -e "s/(\[workspace\.package\]\nversion = \")[^\"]*/\${1}$version/" Cargo.toml
          grep -A1 '^\[workspace.package\]' Cargo.toml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo ./scripts/linux-deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p gitchrono-app --target aarch64-apple-darwin
          cargo build --release -p gitchrono-app --target x86_64-apple-darwin
          ./scripts/bundle-macos.sh "${{ steps.version.outputs.version }}" \
            target/aarch64-apple-darwin/release/gitchrono \
            target/x86_64-apple-darwin/release/gitchrono

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p gitchrono-app --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist/GitChrono-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/gitchrono.exe $stage/
          Copy-Item README.md $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Remove-Item -Recurse $stage

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p gitchrono-app --target ${{ matrix.target }}
          name="GitChrono-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/gitchrono packaging/linux/gitchrono.desktop packaging/linux/gitchrono.png README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: GitChrono ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*

      # Releases made with GITHUB_TOKEN don't trigger other workflows, but a
      # manual dispatch does: rebuild the site so /changelog lists this release.
      - name: Update the website changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
